<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>الطلاب - مركز غيم</title></head><body>
<aside class="sidebar"><div class="brand"><div class="cloud">☁</div><div><strong>مركز غيم</strong><span>لضيافة الأطفال</span></div></div><nav><a href="index.html">الرئيسية</a><a class="active" href="students.html">الطلاب</a><a href="payment.html">تسجيل دفعة</a><a href="payments.html">سجل المدفوعات</a><a href="schedule.html">المواعيد القادمة</a><a href="reports.html">التقارير</a><a href="settings.html">الإعدادات</a></nav><button class="logout-btn" onclick="logout()">تسجيل الخروج</button></aside>
<main><header class="topbar"><button class="menu" onclick="toggleMenu()">☰</button><div><div class="eyebrow">الطلاب</div><h1>إدارة الطلاب</h1></div></header>
<section class="level-cards" id="levelCards"></section>
<section class="card"><div class="section-head"><div><small>سجل الطلاب</small><h3>قائمة الأطفال المسجلين</h3></div><button class="primary" onclick="openStudent()">＋ إضافة طالب</button></div>
<div class="filters"><input id="studentSearch" placeholder="🔎 البحث بالاسم أو الرقم..." oninput="renderStudents()"><select id="levelFilter" onchange="renderStudents()"></select></div>
<div class="table-wrap"><table><thead><tr><th>الرقم</th><th>اسم الطالب</th><th>رقم ولي الأمر</th><th>المرحلة</th><th>تاريخ التسجيل</th><th>الرسوم</th><th>المدفوع</th><th>المتبقي</th><th>إجراءات</th></tr></thead><tbody id="studentsTable"></tbody></table></div></section></main>
<div class="modal" id="studentModal"><div class="modal-box"><button class="close" onclick="closeStudent()">×</button><h2 id="studentModalTitle">إضافة طالب</h2><input type="hidden" id="sId"><label>رقم الطالب<input id="sNumber" placeholder="مثال: 1001"></label><label>اسم الطالب<input id="sName" placeholder="اسم الطالب"></label><label>رقم ولي الأمر<input id="sGuardianPhone" type="tel" inputmode="tel" placeholder="05xxxxxxxx"></label><label>المرحلة<select id="sLevel"></select></label><label>تاريخ التسجيل<input id="sCreated" type="date"></label><label>إجمالي الرسوم<input id="sFees" type="number" min="0" placeholder="إجمالي الرسوم"></label><label>ملاحظات<textarea id="sNotes"></textarea></label><button class="primary wide" onclick="saveStudent(this)">حفظ البيانات</button></div></div>
<script src="js/api.js"></script><script src="js/app.js?v=6"></script><script>initStudentPage();</script></body></html>
