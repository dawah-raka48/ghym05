<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>ملف الطالب - مركز غيم</title></head><body><aside class="sidebar"><div class="brand"><div class="cloud">☁</div><div><strong>مركز غيم</strong><span>لضيافة الأطفال</span></div></div><nav><a href="index.html">الرئيسية</a><a class="active" href="students.html">الطلاب</a><a href="payment.html">تسجيل دفعة</a><a href="payments.html">سجل المدفوعات</a><a href="schedule.html">المواعيد القادمة</a><a href="reports.html">التقارير</a><a href="settings.html">الإعدادات</a></nav></aside><main><header class="topbar"><a class="outline" href="students.html">← العودة</a><div><div class="eyebrow">الملف المالي</div><h1 id="title">ملف الطالب</h1></div></header><section class="stats"><div class="stat"><small>إجمالي الرسوم</small><strong id="sf">0</strong><em>ريال</em></div><div class="stat"><small>المدفوع</small><strong id="sp">0</strong><em>ريال</em></div><div class="stat"><small>المتبقي</small><strong id="sr">0</strong><em>ريال</em></div><div class="stat"><small>المستوى</small><strong id="sl">-</strong></div></section><section class="card"><div class="section-head"><div><small>التاريخ المالي</small><h3>سجل دفعات الطالب</h3></div><a class="primary" id="payLink" href="payment.html">＋ تسجيل دفعة</a></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>المبلغ</th><th>طريقة الدفع</th><th>المرجع</th></tr></thead><tbody id="history"></tbody></table></div></section></main><script src="js/api.js"></script><script src="js/app.js?v=6"></script><script>(function(){let id=new URLSearchParams(location.search).get("id"),d=db(),s=d.students.find(x=>x.id===id);if(!s){title.textContent="الطالب غير موجود";return}title.textContent=s.name;sl.textContent=s.level;sf.textContent=money(s.fees);let ps=d.payments.filter(p=>p.studentId=id);let paid=ps.reduce((a,p)=>a+Number(p.amount),0);sp.textContent=money(paid);sr.textContent=money(Math.max(s.fees-paid,0));payLink.href="payment.html";history.innerHTML=ps.slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${money(p.amount)} ريال</td><td>${p.method}</td><td>${p.ref||"-"}</td></tr>`).join("")||'<tr><td colspan="4">لا توجد دفعات</td></tr>'})()</script></body></html>
